# Static analysis (SAST) with CodeQL: injection, unsafe deserialization, weak crypto and the
# like in the C# code, and insecure patterns in these workflows. Results go to the Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new CodeQL queries also look at code that hasn't changed.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The extended suite adds security queries with more findings (and more false positives).
          queries: security-extended

      # A real build, so CodeQL sees exactly what the compiler compiles.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: dotnet build CqrsApiExample.slnx --configuration Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
