# Weekly update pull requests for NuGet packages (Directory.Packages.props), GitHub Actions and
# the Docker base images. Security updates are opened as soon as an advisory is published,
# independently of this schedule (enable "Dependabot security updates" in the repository settings).
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates in one pull request; majors stay separate, to be read first.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 8+ has a commercial license (see Directory.Packages.props).
      - dependency-name: FluentAssertions
        versions: [">= 8.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
